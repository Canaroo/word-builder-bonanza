  <body>
    <div id="root"></div>
    <div id="toast" style="display: block; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; z-index: 9999; transition: opacity 0.5s ease-in-out; opacity: 0; pointer-events: none;">Score submitted!</div>
    <script type="module" src="/index.tsx"></script>
    <script>
      function showToast(message) {
        const toast = document.getElementById("toast");
        if (toast) {
          toast.textContent = message;
          toast.classList.add("show");
          setTimeout(() => {
            toast.classList.remove("show");
          }, 2000);
        }
      }
    </script>
  </body>
